server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用：任何前端路由（/editor/34 之类）都回到 index.html，由 React Router 处理
    location / {
        try_files $uri /index.html;
    }

    # SSE（实时执行进度）：必须关掉缓冲，否则事件会被 nginx 攒着、一次性吐出来，界面看起来像卡住；
    # 执行可能持续几分钟，读超时放宽。这条要写在通用的 /api/ 之前（正则 location 优先于前缀）
    location ~ ^/api/workflows/[0-9]+/execute/stream$ {
        proxy_pass http://backend:8084;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 其余接口：续跑是同步请求，视频节点最长要等好几分钟，所以读超时给 10 分钟
    location /api/ {
        proxy_pass http://backend:8084;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
