server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: PaiAgent
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java,src/main/resources
    livereload:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      password: ${REDIS_PASSWORD:}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:paiagent}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  ai:
    openai:
      # 占位配置，实际使用时通过节点配置动态指定
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: https://api.openai.com

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.paiagent.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  info:
    title: PaiAgent API
    description: AI Agent 流图执行面板 API 文档
    version: 1.0.0

# MinIO 配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucketName: paiagent
  publicUrl: ${MINIO_PUBLIC_URL:http://localhost:9000}

# PaiAgent 配置
paiagent:
  auth:
    # 本地开发未配置 JWT_SECRET 时会自动生成临时强密钥；生产环境请务必显式配置
    jwt-secret: ${JWT_SECRET:}
    access-token-expiration-minutes: 120
    refresh-token-expiration-hours: 168
  # 默认管理员账户（生产环境必须修改或禁用）
  # 通过环境变量 APP_AUTH_DEFAULT_USERNAME 和 APP_AUTH_DEFAULT_PASSWORD 配置
  # 留空则禁用默认账户，必须通过注册功能创建账户
  default-username: ${APP_AUTH_DEFAULT_USERNAME:admin}
  default-password: ${APP_AUTH_DEFAULT_PASSWORD:admin123}
  skills:
    path: skills
  memory:
    # Agent 长期记忆使用独立的 SQLite 文件存储，与主库 MySQL 解耦
    sqlite-path: ${AGENT_MEMORY_DB_PATH:data/agent-memory.db}
  # 执行引擎与并发
  engine:
    # 同一依赖层内互不依赖的节点是否并发执行；出问题时可设为 false 一键退回串行
    parallel-enabled: ${PAIAGENT_PARALLEL_ENABLED:true}
  executor:
    # 整条工作流执行的线程池：队列满直接拒绝（接口返回 429），而不是无限排队/无限建线程
    execution:
      size: ${PAIAGENT_EXEC_POOL_SIZE:8}
      queue: ${PAIAGENT_EXEC_QUEUE:32}
    # 节点并发线程池：队列满时由调用线程自己执行，退化为串行
    node:
      size: ${PAIAGENT_NODE_POOL_SIZE:16}
      queue: ${PAIAGENT_NODE_QUEUE:64}
  execution:
    # RUNNING 状态超过该时间没有心跳，就被判定为僵尸执行并置为 FAILED（可从断点续跑）
    stale-after-minutes: ${PAIAGENT_STALE_AFTER_MINUTES:30}
    reaper-interval-ms: 60000
  # 大模型调用保护
  llm:
    connect-timeout-ms: 10000
    read-timeout-ms: 120000
    max-attempts: 3
    retry-initial-backoff-ms: 1000
    retry-max-backoff-ms: 8000
    # 每个供应商同时在途的调用上限，超出的排队，排队超过 acquire-timeout-ms 则快速失败
    max-concurrent-per-provider: ${PAIAGENT_LLM_MAX_CONCURRENT:8}
    acquire-timeout-ms: 30000
  security:
    # AES-GCM 加密落库的主密钥：32 字节随机值的 Base64，或任意口令（SHA-256 派生）。
    # 生产环境必须通过环境变量显式配置；留空则回退到本机密钥文件（仅限本地开发）。
    encryption-key: ${PAIAGENT_ENCRYPTION_KEY:}
    key-file: ${PAIAGENT_KEY_FILE:}
  output:
    # 产物（音频 / 图片 / 视频）和每次执行结果的本地可见文件夹。MinIO 把对象存成内部格式，没法直接在 Finder 里打开，
    # 所以每个产物上传的同时再存一份到这里。相对路径以后端的启动目录（backend/）为基准，默认是仓库根目录下的 outputs/。
    # 留空则关闭。
    dir: ${PAIAGENT_OUTPUT_DIR:../outputs}
